name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: build
      run: |
        set -euo pipefail
        while IFS= read -r -d '' file; do
          g++ -std=c++17 -x c++ -fsyntax-only "$file"
        done < <(find . -type f \( -name "*.cpp" -o -name "*.Cpp" -o -name "*.CPP" \) -print0)
